name: KMP verify

# 编译 + 单测 + 产出可直接安装的 Android APK。
# 不写 Release、不打 tag，push 就能在 Actions 页面下载产物。
on:
  push:
    branches:
      - "**"
    paths:
      - "multiplatform/**"
      - ".github/workflows/kmp-verify.yml"
  pull_request:
    paths:
      - "multiplatform/**"
  workflow_dispatch:

concurrency:
  group: kmp-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  shared-tests:
    name: Shared tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run shared desktop tests
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:desktopTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-desktop-test-report
          path: |
            multiplatform/shared/build/reports/tests/desktopTest
            multiplatform/shared/build/test-results/desktopTest
          if-no-files-found: ignore

  android-apk:
    name: Android APK (signed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # androidApp 在配置阶段就 require 上传递签名存在，没有它整个 Gradle 都配置不了。
      # 有仓库 secret 时用你自己的钥匙（可覆盖安装自己之前的包）；
      # 没有时（例如来自 fork 的 PR）退化成一次性调试钥匙，只保证能编译，产物不可安装。
      - name: Restore upload keystore
        env:
          BJTU_ANDROID_KEYSTORE_BASE64: ${{ secrets.BJTU_ANDROID_KEYSTORE_BASE64 }}
          BJTU_ANDROID_STORE_PASSWORD: ${{ secrets.BJTU_ANDROID_STORE_PASSWORD }}
          BJTU_ANDROID_KEY_ALIAS: ${{ secrets.BJTU_ANDROID_KEY_ALIAS }}
          BJTU_ANDROID_KEY_PASSWORD: ${{ secrets.BJTU_ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.android"
          KEYSTORE="$HOME/.android/bjtu-kmp-upload.keystore"
          if [ -n "$BJTU_ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$BJTU_ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            echo "keystore_source=repository-secret（你自己的钥匙，产物可安装）"
            echo "BJTU_ANDROID_STORE_PASSWORD=$BJTU_ANDROID_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "BJTU_ANDROID_KEY_ALIAS=$BJTU_ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "BJTU_ANDROID_KEY_PASSWORD=$BJTU_ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore "$KEYSTORE" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 2 \
              -dname "CN=CI Debug,O=BJTUselfService,OU=CI,L=Beijing,ST=Beijing,C=CN"
            echo "keystore_source=throwaway（无 secret，产物仅用于验证编译）"
            echo "BJTU_ANDROID_STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "BJTU_ANDROID_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "BJTU_ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi
          echo "BJTU_ANDROID_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      # 把签名证书指纹打进日志：能和本地 `keytool -list -v` 的结果对上，才算真的用了你的钥匙。
      - name: Print APK signer certificate
        run: |
          APK="$(find androidApp/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          echo "apk=$APK"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort | tail -n 1)"
          echo "apksigner=$APKSIGNER"
          # 不用管道接 head：管道会让退出码变成 head 的，也会把输出吞掉。
          "$APKSIGNER" verify --print-certs "$APK" > signer.txt 2>&1 || true
          echo "----- apksigner 输出开始 -----"
          cat signer.txt
          echo "----- apksigner 输出结束 -----"
          grep -E "SHA-256 digest|SHA-1 digest|certificate DN" signer.txt || true

      - name: Rename APK
        id: artifact
        run: |
          APK="$(find androidApp/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          test -n "$APK"
          NAME="BJTUSelfService-KMP-debug-$(git rev-parse --short HEAD).apk"
          cp "$APK" "$NAME"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: kmp-android-apk
          path: multiplatform/${{ steps.artifact.outputs.file }}
          if-no-files-found: error

  windows-compile:
    name: Windows desktop compile
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compile Windows target
        run: .\gradlew.bat :windowsApp:compileKotlinWindows --stacktrace

      - name: Compile macOS/desktop target
        run: .\gradlew.bat :desktopApp:compileKotlin --stacktrace

  windows-msi:
    name: Windows MSI
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Check jpackage
        run: |
          $jp = Join-Path $env:JAVA_HOME "bin\jpackage.exe"
          if (-not (Test-Path $jp)) { throw "jpackage missing: $jp" }
          & $jp --version

      # build.gradle.kts 里的 javaHome 默认值写的是作者本机路径，必须在这里覆盖。
      # 包名/描述用 ASCII：中文 description 会让 WiX light.exe 报 311。
      - name: Build MSI
        run: |
          $env:WINDOWS_PACKAGE_JAVA_HOME = $env:JAVA_HOME
          $env:WINDOWS_PACKAGE_NAME = "BJTUselfServiceKMP"
          $env:WINDOWS_PACKAGE_DESCRIPTION = "BJTU Self Service KMP"
          $env:JAVA_TOOL_OPTIONS = "-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8"
          .\gradlew.bat :windowsApp:packageMsi --no-daemon --stacktrace

      - name: Print jpackage logs
        if: failure()
        run: |
          Get-ChildItem -Recurse "windowsApp\build\compose\logs","windowsApp\build\jpackage-shim" -Include *.txt,*.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.FullName) ====="
            Get-Content -LiteralPath $_.FullName -ErrorAction SilentlyContinue
          }

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: kmp-windows-msi
          path: multiplatform/windowsApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
